# CI — garde-fou à chaque push / pull request.
# Lance en parallèle backend (NestJS) et frontend (Next.js) : lint + tests + build.
# Les deux packages sont indépendants (pas de workspaces) : jobs séparés.

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Même étape que dans le Dockerfile : le client Prisma n'est pas
      # embarqué dans @prisma/client, il doit être généré depuis le schéma.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      # Tests unitaires : DB mockée, aucun PostgreSQL requis.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  frontend:
    name: Frontend — lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # NEXT_PUBLIC_API_URL est inliné au build : on reprend la valeur de prod.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api