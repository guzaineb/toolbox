# Reverse proxy pour ProjectStruct
# Point d'entrée unique : le navigateur ne voit que 80/443, les conteneurs
# restent sur le réseau Docker interne.
#
# NOTE : les `upstream` sont résolus au démarrage de Nginx. Si les conteneurs
# api/web sont recréés avec une nouvelle IP, il faut redémarrer Nginx
# (le script deploy.sh le fait).

upstream toolbox_api {
    server api:3000;
    keepalive 32;
}

upstream toolbox_web {
    server web:3000;
    keepalive 16;
}

# WebSocket (socket.io) : timeouts longs et pas de buffering
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Limite de taille des uploads (10 Mo comme côté API)
client_max_body_size 12m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # --- API REST ---
    # /api/projects/... -> api:3000/projects/...
    location /api/ {
        proxy_pass http://toolbox_api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- WebSocket socket.io ---
    # Le client socket.io utilise le path /socket.io et le namespace /notifications.
    location /socket.io/ {
        proxy_pass http://toolbox_api/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # --- Fichiers statiques uploadés par l'API ---
    location /uploads/ {
        proxy_pass http://toolbox_api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # `expires` pose déjà l'en-tête Cache-Control : ne pas le dupliquer.
        expires 7d;
    }

    # --- Frontend Next.js ---
    location / {
        proxy_pass http://toolbox_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
